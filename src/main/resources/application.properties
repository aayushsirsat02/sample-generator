spring.application.name=sample
server.port=2020

# ==========================================
# FILE UPLOAD CONFIGURATION
# ==========================================

spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
spring.servlet.multipart.file-size-threshold=2MB

# ==========================================
# MYSQL DATABASE CONFIGURATION
# ==========================================

spring.datasource.url=jdbc:mysql://localhost:3306/sample_report_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Kolkata
spring.datasource.username=root
spring.datasource.password=Aayush@1234
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ==========================================
# JPA / HIBERNATE
# ==========================================

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# ==========================================
# ERROR DETAILS
# ==========================================

server.error.include-message=always
server.error.include-stacktrace=always