
<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Login | Sample Report Generator</title>

    <!-- Bootstrap CSS -->
    <link
            href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
            rel="stylesheet">

    <!-- Custom CSS -->
    <link rel="stylesheet"
          th:href="@{/css/login2.css}">

</head>


<body>


<div class="login-container">


    <!-- LOGO -->

    <div class="logo">

        <div class="logo-icon">
            SR
        </div>

        <div class="logo-text">
            SampleReport
        </div>

    </div>


    <!-- HEADER -->

    <div class="login-header">

        <h1 id="loginTitle">
            Welcome back
        </h1>

        <p id="loginDescription">
            Enter your credentials to access your dashboard.
        </p>

    </div>


    <!-- USER / ADMIN SWITCH -->

<!--    <div class="login-switch">-->

<!--        <button-->
<!--                type="button"-->
<!--                class="switch-button active"-->
<!--                id="userButton"-->
<!--                onclick="changeLoginType('user')">-->

<!--            User Login-->

<!--        </button>-->


<!--        <button-->
<!--                type="button"-->
<!--                class="switch-button"-->
<!--                id="adminButton"-->
<!--                onclick="changeLoginType('admin')">-->

<!--            Admin Login-->

<!--        </button>-->

<!--    </div>-->


    <!-- LOGIN ERROR -->

    <div
            th:if="${param.error}"
            class="alert alert-danger">

        Invalid username or password.

    </div>


    <!-- LOGOUT MESSAGE -->

    <div
            th:if="${param.logout}"
            class="alert alert-success">

        You have been logged out successfully.

    </div>


    <!-- LOGIN FORM -->

    <form
            id="loginForm"
            th:action="@{/login}"
            method="post">


        <!-- EMAIL -->

        <div class="form-group">

            <label for="email">
                Email Address
            </label>

            <div class="input-wrapper">

                <input
                        type="email"
                        id="email"
                        name="username"
                        placeholder="Enter your email"
                        autocomplete="username"
                        required>

            </div>

        </div>


        <!-- PASSWORD -->

        <div class="form-group">

            <label for="password">
                Password
            </label>

            <div class="input-wrapper">

                <input
                        type="password"
                        id="password"
                        name="password"
                        class="password-input"
                        placeholder="Enter your password"
                        autocomplete="current-password"
                        required>


                <span
                        class="password-toggle"
                        id="passwordToggle"
                        onclick="togglePassword()">

                    Show

                </span>

            </div>

        </div>


        <!-- OPTIONS -->

        <div class="form-options">

            <label class="remember">

                <input
                        type="checkbox"
                        id="rememberMe"
                        name="remember-me">

                Remember me

            </label>


            <a href="#"
               class="forgot-password">

                Forgot password?

            </a>

        </div>


        <!-- LOGIN TYPE -->

        <input
                type="hidden"
                id="loginType"
                name="loginType"
                value="user">


        <!-- LOGIN BUTTON -->

        <button
                type="submit"
                class="login-button"
                id="loginButton">

            Login

        </button>


    </form>


    <!-- FOOTER -->

    <div class="login-footer">

        © 2026 Sample Report Generator

    </div>


</div>


<!-- Bootstrap JavaScript -->

<script
        src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js">
</script>


<!-- Custom JavaScript -->

<script th:src="@{/js/login.js}"></script>


</body>

</html>
